    <!DOCTYPE html>

<body>

    <div class="admin-container">
        <h1>Painel de Controle - Agenda</h1>
        
        <form id="form-admin">
            
            <div class="form-group">
                <label for="banner-quadra">Alterar Banner da Quadra:</label>
                <input type="file" id="banner-quadra" accept="image/*">
            </div>

            <div class="form-group">
                <label for="dia-destaque">Selecionar Dia em Destaque (Fevereiro):</label>
                <select id="dia-destaque">
                    </select>
            </div>

            <div class="form-group">
                <label for="banner-almoco">Alterar Banner Música no Almoço:</label>
                <input type="file" id="banner-almoco" accept="image/*">
            </div>

            <div class="form-group">
                <label for="link-enquete">Link ou Pergunta da Enquete:</label>
                <input type="text" id="link-enquete" placeholder="Ex: Qual o melhor gênero musical?">
            </div>

            <div class="form-group">
                <label for="link-spotify">Link da Playlist do Spotify:</label>
                <input type="text" id="link-spotify" placeholder="https://open.spotify.com/playlist/...">
            </div>

            <button type="submit" class="btn-salvar">ATUALIZAR AGENDA</button>

        </form>
    </div>

    <script src="/js/admin-script.js"></script>
